name: Studio tests

on:
  push:
    paths:
      - "plugins/wan2gp_studio/**"
      - "plugins/plugin_manager/**"
      - "shared/utils/plugins.py"
      - ".github/workflows/studio-tests.yml"
  pull_request:
    paths:
      - "plugins/wan2gp_studio/**"
      - "plugins/plugin_manager/**"
      - "shared/utils/plugins.py"
      - ".github/workflows/studio-tests.yml"

jobs:
  studio-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU torch (shared.utils imports it at package init)
        run: pip install "torch==2.10.0" --index-url https://download.pytorch.org/whl/cpu
      - name: Install test dependencies
        run: |
          pip install \
            "diffusers==0.36.0" \
            "gradio==5.29.0" \
            "GitPython==3.1.45" \
            "tqdm==4.70.1" \
            "requests==2.34.2" \
            "fastapi==0.142.2" \
            "httpx==0.28.1" \
            "pillow==11.3.0" \
            "psutil==7.2.2" \
            "pytest==9.1.1" \
            "mutagen==1.48.1"
      - name: Run Studio tests
        env:
          WANFLOW_UI_REQUIRED: "1"
        run: python -m pytest plugins/wan2gp_studio/tests -q
      - name: Run plugin manager tests (version compare, update fork-guard)
        run: python -m pytest plugins/plugin_manager/tests -q
      - name: Run vendored WanFlow UI tests (reconciled fork vs current WanGP)
        run: python -m pytest plugins/wan2gp-wanflow-ui/tests -q

  # Optional integration job. The WanFlow UI fork is vendored at
  # plugins/wan2gp-wanflow-ui and covered by the main job above; this job is
  # opt-in for testing Studio against a DIFFERENT WanFlow version. Point the
  # repository variables (Settings -> Secrets and variables -> Actions ->
  # Variables) at that checkout:
  #   WANFLOW_UI_REPO  e.g. https://github.com/<owner>/wan2gp-wanflow-ui
  #   WANFLOW_UI_REF   branch or tag; defaults to main
  # When WANFLOW_UI_REPO is unset the job is skipped. With WANFLOW_UI_REQUIRED=1
  # a missing WanFlow import fails the run instead of silently skipping tests.
  studio-integration:
    if: ${{ vars.WANFLOW_UI_REPO != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU torch (shared.utils imports it at package init)
        run: pip install "torch==2.10.0" --index-url https://download.pytorch.org/whl/cpu
      - name: Install test dependencies
        run: |
          pip install \
            "diffusers==0.36.0" \
            "gradio==5.29.0" \
            "GitPython==3.1.45" \
            "tqdm==4.70.1" \
            "requests==2.34.2" \
            "fastapi==0.142.2" \
            "httpx==0.28.1" \
            "pillow==11.3.0" \
            "psutil==7.2.2" \
            "pytest==9.1.1" \
            "mutagen==1.48.1"
      - name: Install WanFlow UI
        run: git clone --depth 1 --branch "${{ vars.WANFLOW_UI_REF || 'main' }}" "${{ vars.WANFLOW_UI_REPO }}" plugins/wan2gp-wanflow-ui
      - name: Run Studio tests against real WanFlow
        env:
          WANFLOW_UI_REQUIRED: "1"
        run: python -m pytest plugins/wan2gp_studio/tests -q
