<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">WanGP Studio — Workflow-first UI concept</title>
<desc id="desc">Dark desktop interface concept with navigation sidebar, node library, workflow canvas, inspector and execution queue.</desc>
